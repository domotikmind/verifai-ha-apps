name: "VerifAI Data Service"
version: "1.1.0"
slug: "verifai_data"
description: "PostgreSQL 16 + PostgREST + Adminer para VerifAI"
url: "https://github.com/domotikmind/verifai-ha-apps"

arch:
  - aarch64
  - amd64

init: false
startup: system
boot: auto
backup: cold
stage: experimental

ingress: true
ingress_port: 8099
panel_icon: "mdi:database-eye"
panel_title: "VerifAI DB"
panel_admin: true

map:
  - type: share
    read_only: false

options:
  database: "verifai"
  username: "verifai_admin"
  password: null
  timezone: "Europe/Madrid"
  restore_dump: "verifai_full.dump"

schema:
  database: str
  username: str
  password: password
  timezone: str
  restore_dump: str
